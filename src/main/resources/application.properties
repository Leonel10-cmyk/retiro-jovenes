# Server - Render assigns PORT dynamically, default 8080 for local dev
server.port=${PORT:8080}

# Database - Soporta H2 local por defecto o MySQL en la nube automaticamente
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/retiro-db;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:retiro2026}

# JPA - Auto-detecta el dialecto (H2 o MySQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (para administracion local con H2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Inicializacion de datos gestionada por DataInitializer (compatible con H2 y MySQL)
spring.sql.init.mode=never

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# App name
spring.application.name=Retiro Jovenes

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Login Credentials
app.auth.username=admin
app.auth.password=retiro2026
