# Server - Render assigns PORT dynamically, default 8080 for local dev
server.port=${PORT:8080}

# H2 Database - File based (persists data)
spring.datasource.url=jdbc:h2:file:./data/retiro-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=retiro2026

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (for admin access)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL init - defer to run AFTER JPA creates tables
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# App name
spring.application.name=Retiro Jovenes

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Login Credentials
app.auth.username=admin
app.auth.password=retiro2026
