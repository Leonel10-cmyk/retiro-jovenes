<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Joven - Retiro Jóvenes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-retiro">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-stars"></i> Retiro Jóvenes 2026</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon" style="filter:invert(1)"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto gap-1 align-items-center">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house"></i> Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/registro"><i class="bi bi-person-plus"></i> Registrar</a></li>
                    <li class="nav-item"><a class="nav-link" href="/crud"><i class="bi bi-table"></i> Ver Registros</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/personas"><i class="bi bi-people"></i> Padrón de Jóvenes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/reportes"><i class="bi bi-file-earmark-bar-graph"></i> Reportes</a></li>
                    <li class="nav-item ms-lg-2">
                        <a href="/logout" class="btn btn-sm btn-outline-light" title="Cerrar Sesión">
                            <i class="bi bi-box-arrow-right"></i> Salir
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- HERO -->
    <div class="hero-header" style="padding: 1.5rem 1rem;">
        <h1 style="font-size:1.4rem;"><i class="bi bi-pencil-square"></i> Editar Datos de Joven</h1>
        <p>Modifica la información en el padrón oficial</p>
    </div>

    <div class="container py-4" style="max-width: 650px;">
        <div class="card-retiro">
            <div class="card-header">
                <i class="bi bi-person-badge"></i> Datos del Joven
            </div>
            <div class="p-4">
                <div class="text-center mb-4">
                    <div class="persona-avatar-large" th:text="${persona.iniciales}"></div>
                    <h4 style="font-weight:800; color:var(--marron-profundo);" th:text="${persona.nombreCompleto}"></h4>
                    <span class="badge-grupo" th:text="'Grupo ' + ${persona.numeroGrupo}"></span>
                </div>

                <form action="/personas/guardar" method="POST">
                    <input type="hidden" name="id" th:value="${persona.id}">

                    <div class="mb-3">
                        <label class="form-label fw-bold" style="color:var(--marron-profundo);">Nombres <span class="text-danger">*</span></label>
                        <input type="text" name="nombres" class="form-control" th:value="${persona.nombres}" required
                               style="border-radius:10px; border:2px solid #e8d5b0; padding:0.6rem 1rem;">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold" style="color:var(--marron-profundo);">Apellidos</label>
                        <input type="text" name="apellidos" class="form-control" th:value="${persona.apellidos}"
                               style="border-radius:10px; border:2px solid #e8d5b0; padding:0.6rem 1rem;">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold" style="color:var(--marron-profundo);">
                            <i class="bi bi-buildings" style="color:var(--dorado-principal);"></i> Iglesia de Procedencia <span class="text-danger">*</span>
                        </label>
                        <select name="iglesia" class="form-select" required style="border-radius:10px; border:2px solid #e8d5b0; padding:0.6rem 1rem;">
                            <option th:each="igl : ${iglesias}"
                                    th:value="${igl.name()}"
                                    th:text="${igl.displayName}"
                                    th:selected="${igl == persona.iglesia}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold" style="color:var(--marron-profundo);">Rol <span class="text-danger">*</span></label>
                        <select name="rol" class="form-select" required style="border-radius:10px; border:2px solid #e8d5b0; padding:0.6rem 1rem;">
                            <option th:each="r : ${roles}"
                                    th:value="${r.name()}"
                                    th:text="${r.displayName}"
                                    th:selected="${r == persona.rol}"></option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold" style="color:var(--marron-profundo);">Número de Grupo (1 al 20) <span class="text-danger">*</span></label>
                        <input type="number" name="numeroGrupo" class="form-control" th:value="${persona.numeroGrupo}" min="1" max="20" required
                               style="border-radius:10px; border:2px solid #e8d5b0; padding:0.6rem 1rem;">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-dorado flex-fill">
                            <i class="bi bi-save"></i> Guardar Cambios
                        </button>
                        <a href="/personas" class="btn btn-outline-dorado flex-fill text-center">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <span>II Retiro Presbiterial de Jóvenes</span> &bull; Jóvenes, Volvamos a Dios &bull; Canto Grande
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
