<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Iniciar Sesión - Retiro Jóvenes 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--fondo-claro) 0%, #fff 100%);
            padding: 1rem;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px var(--sombra);
            overflow: hidden;
            border: 2px solid #f0e8d0;
        }
        .login-header {
            background: linear-gradient(135deg, var(--marron-profundo) 0%, var(--dorado-oscuro) 60%, var(--dorado-principal) 100%);
            color: white;
            padding: 2.2rem 1.5rem 1.8rem;
            text-align: center;
        }
        .login-logo {
            width: 70px;
            height: 70px;
            background: rgba(255,255,255,0.15);
            border: 2px solid var(--dorado-principal);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <i class="bi bi-shield-lock-fill" style="color:var(--dorado-principal);"></i>
            </div>
            <h3 style="font-weight:900; margin:0; font-size:1.4rem;">Sistema de Retiro</h3>
            <p style="margin:0.4rem 0 0; color:var(--fondo-claro); font-size:0.85rem; font-weight:600;">
                II Retiro Presbiterial de Jóvenes &bull; Canto Grande
            </p>
        </div>

        <div class="p-4">
            <!-- Flash Alerts -->
            <div th:if="${error}" class="alert-retiro-error mb-3" role="alert">
                <i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}"></span>
            </div>
            <div th:if="${info}" class="alert-retiro-success mb-3" role="alert">
                <i class="bi bi-check-circle-fill"></i> <span th:text="${info}"></span>
            </div>

            <form action="/login" method="POST" autocomplete="off">
                <div class="mb-3">
                    <label class="form-label fw-bold" style="color:var(--marron-profundo);">
                        <i class="bi bi-person-fill" style="color:var(--dorado-oscuro);"></i> Usuario
                    </label>
                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="Ingresa tu usuario"
                           required
                           autofocus
                           autocomplete="off"
                           style="border-radius:10px; border:2px solid #e8d5b0; padding:0.7rem 1rem;">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold" style="color:var(--marron-profundo);">
                        <i class="bi bi-key-fill" style="color:var(--dorado-oscuro);"></i> Contraseña
                    </label>
                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="••••••••"
                           required
                           autocomplete="new-password"
                           style="border-radius:10px; border:2px solid #e8d5b0; padding:0.7rem 1rem;">
                </div>

                <button type="submit" class="btn btn-dorado w-100" style="padding:0.75rem; font-size:1.05rem;">
                    <i class="bi bi-box-arrow-in-right"></i> Ingresar al Sistema
                </button>
            </form>
        </div>
    </div>
</body>
</html>
